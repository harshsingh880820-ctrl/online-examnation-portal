{% extends "base.html" %}{% block title %}Create exam{% endblock %}
{% block content %}<div class="form-shell"><a href="{{ url_for('dashboard') }}" class="text-decoration-none">← Dashboard</a><div class="panel-card mt-3"><span class="eyebrow">EXAM SETUP</span><h1 class="page-title mt-2">Create an examination</h1><p class="text-secondary">After creating the exam, add questions and publish it.</p><form method="post" class="mt-4"><label class="form-label">Exam title</label><input class="form-control mb-3" name="title" required maxlength="150" placeholder="e.g. Database Management Systems"><label class="form-label">Description</label><textarea class="form-control mb-3" name="description" rows="3" placeholder="Instructions or topics covered"></textarea><label class="form-label">Duration (minutes)</label><input class="form-control mb-4" type="number" name="duration_minutes" min="1" max="300" value="30" required><button class="btn btn-primary">Create and add questions →</button></form></div></div>{% endblock %}
