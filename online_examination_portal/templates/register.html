{% extends "base.html" %}{% block title %}Student registration{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">GET STARTED</span><h2 class="fw-bold mt-2">Create student account</h2><p class="text-secondary">Registration creates a student account only.</p><form method="post" class="mt-4"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="100"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required autocomplete="new-password"><button class="btn btn-primary btn-lg w-100">Register</button></form></div></div>{% endblock %}
