{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h2 class="fw-bold mt-2">Log in to ExamPortal</h2><p class="text-secondary">Continue to your dashboard.</p><form method="post" class="mt-4"><label class="form-label">Email address</label><input class="form-control form-control-lg mb-3" type="email" name="email" required autocomplete="username"><label class="form-label">Password</label><input class="form-control form-control-lg mb-3" type="password" name="password" required autocomplete="current-password"><button class="btn btn-primary btn-lg w-100">Log in</button></form><p class="mt-3 mb-0 text-secondary">New student? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
